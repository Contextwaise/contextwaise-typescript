name: Bug report
description: Something in the TypeScript SDK doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. Remove API keys and private data.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      description: Output of `npm ls contextwaise`
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and OS
    validations:
      required: true
  - type: dropdown
    id: key
    attributes:
      label: Contextwaise API key set?
      options: ["Yes (hosted scoring)", "No (local cleanup only)"]
    validations:
      required: true
