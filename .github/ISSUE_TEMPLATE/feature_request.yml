name: Feature request
description: Suggest an option, an adapter or a change to how context is cut.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The API or behavior you have in mind. Alternatives you considered are welcome too.
